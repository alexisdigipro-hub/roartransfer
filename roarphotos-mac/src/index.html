<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoarPhotos</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand" data-tauri-drag-region>
      <span class="by" data-tauri-drag-region>The Mad Lions</span>
      <b data-tauri-drag-region>Roar<i>Photos</i></b>
    </div>
    <nav class="nav">
      <h6>Βιβλιοθήκη</h6>
      <button data-view="all" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Όλα<span class="n" id="n-all"></span></button>
      <button data-view="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>Φωτογραφίες<span class="n" id="n-photos"></span></button>
      <button data-view="videos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>Βίντεο<span class="n" id="n-videos"></span></button>
      <button data-view="favs"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Αγαπημένα<span class="n" id="n-favs"></span></button>
      <button data-view="hidden"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg>Κρυμμένα<span class="n" id="n-hidden"></span></button>

      <h6>Άλμπουμ <button class="plus" id="album-new" title="Νέο άλμπουμ">+</button></h6>
      <div id="albums"></div>

      <h6>Φάκελοι <button class="plus" id="src-add" title="Προσθήκη φακέλου">+</button></h6>
      <div id="sources"></div>
    </nav>
    <div class="job" id="job" hidden>
      <span id="job-t"></span>
      <div class="bar"><i id="job-bar"></i></div>
    </div>
    <div class="foot">Όλα μένουν στο Mac σου. Τίποτα δεν ανεβαίνει πουθενά.</div>
  </aside>

  <main class="main">
    <header class="top" data-tauri-drag-region>
      <div class="title" data-tauri-drag-region>
        <h1 id="title" data-tauri-drag-region>Όλα</h1>
        <small id="subtitle" data-tauri-drag-region></small>
      </div>
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="q" type="search" placeholder="Αναζήτηση: όνομα, φάκελος, κάμερα, 2024-05…" spellcheck="false"></label>
        <div class="stars-f" id="f-stars" title="Τουλάχιστον τόσα αστέρια"></div>
        <div class="labels-f" id="f-label" title="Χρώμα"></div>
        <select id="f-cam" title="Κάμερα"><option value="">Όλες οι κάμερες</option></select>
        <button class="ic" id="sort" title="Σειρά"><svg viewBox="0 0 24 24"><path d="M8 4v16m0 0-3.5-3.5M8 20l3.5-3.5M16 20V4m0 0-3.5 3.5M16 4l3.5 3.5"/></svg></button>
        <input id="zoom" type="range" min="90" max="340" step="10" value="170" title="Μέγεθος">
      </div>
    </header>

    <section class="scroll" id="scroll">
      <div id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </section>
    <div class="years" id="years"></div>

    <div class="selbar" id="selbar" hidden>
      <b id="sel-n"></b>
      <div class="stars" id="sel-stars"></div>
      <div class="labels" id="sel-labels"></div>
      <button class="ic" id="sel-fav" title="Αγαπημένο (F)"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
      <span class="sep"></span>
      <button id="sel-album">Σε άλμπουμ</button>
      <button id="sel-unalbum" hidden>Βγάλε από το άλμπουμ</button>
      <button id="sel-compare" title="C">Σύγκριση</button>
      <button id="sel-export" title="E">Εξαγωγή</button>
      <button id="sel-hide" title="H">Απόκρυψη</button>
      <button id="sel-trash" class="danger">Κάδος</button>
      <button class="ic x" id="sel-clear" title="Esc"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </main>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="stage" id="stage"></div>
  <button class="nav-b prev" id="v-prev" title="←"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="nav-b next" id="v-next" title="→"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <div class="v-top" data-tauri-drag-region>
    <button class="ic" id="v-close" title="Esc"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="v-name" id="v-name" data-tauri-drag-region></div>
    <div class="stars" id="v-stars"></div>
    <div class="labels" id="v-labels"></div>
    <button class="ic" id="v-fav" title="F"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
    <button class="ic" id="v-info" title="I"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </div>
  <aside class="info" id="info" hidden></aside>
</div>

<div class="compare" id="compare" hidden>
  <div class="c-top" data-tauri-drag-region>
    <button class="ic" id="c-close" title="Esc"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
    <span data-tauri-drag-region>Σύγκριση · κλικ για 100%, τα ίδια σημεία σε όλες</span>
  </div>
  <div class="c-grid" id="c-grid"></div>
</div>

<div class="modal" id="modal" hidden><div class="card" id="modal-card"></div></div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
