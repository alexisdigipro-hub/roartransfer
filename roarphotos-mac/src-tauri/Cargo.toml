[package]
name = "roarphotos"
version = "0.1.0"
description = "RoarPhotos: your photos and videos on your Mac, offline"
authors = ["The Mad Lions"]
edition = "2021"

[lib]
name = "roarphotos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
kamadak-exif = "0.6"
walkdir = "2"
chrono = "0.4"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
