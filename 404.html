<!doctype html>
<meta charset="utf-8">
<title>RoarTransfer</title>
<meta name="robots" content="noindex">
<!-- the short links (Alex, 21 Oct): roartransfer.com/<token> has no page of its own on GitHub Pages, so it lands
     here and goes on to the one page as ?t=<token>; that page puts the short address back in the bar -->
<script>
  var m = location.pathname.match(/^\/([A-Za-z0-9]{6,32})\/?$/)
  location.replace('/' + (m ? '?t=' + m[1] : '') + location.hash)
</script>
